<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мои страны</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column; }

    /* ── Header ── */
    #header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 12px 8px;
      flex-shrink: 0;
    }
    #search {
      width: 100%; background: #21262d; border: 1px solid #30363d;
      border-radius: 8px; padding: 9px 12px; color: #c9d1d9;
      font-size: 14px; outline: none;
    }
    #search::placeholder { color: #484f58; }
    #search:focus { border-color: #58a6ff; }

    /* ── Counter bar ── */
    #counter-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 14px; background: #0d1117;
      border-bottom: 1px solid #21262d; flex-shrink: 0;
    }
    #counter-label { font-size: 13px; color: #8b949e; }
    #counter-badge {
      background: #21262d; color: #484f58;
      font-size: 12px; font-weight: 700;
      padding: 3px 11px; border-radius: 20px;
      min-width: 60px; text-align: center;
      transition: background .2s, color .2s;
    }
    #counter-badge.has { background: #238636; color: #fff; }

    /* ── List ── */
    #list {
      overflow-y: auto; flex: 1; padding: 6px 10px 90px;
      -webkit-overflow-scrolling: touch;
    }
    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px;
      cursor: pointer; transition: background .12s;
      user-select: none;
    }
    .row:active { background: #1c2128; }
    .row.on { background: #0f2617; }
    .flag { font-size: 21px; width: 28px; text-align: center; flex-shrink: 0; }
    .name { flex: 1; font-size: 14px; }
    .row.on .name { color: #3fb950; }
    .box {
      width: 21px; height: 21px; border: 2px solid #30363d;
      border-radius: 5px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, border-color .12s;
    }
    .row.on .box { background: #238636; border-color: #238636; }
    .tick { display: none; }
    .row.on .tick { display: block; }
    .empty { text-align: center; color: #484f58; font-size: 14px; padding: 32px 0; }

    /* ── Bottom button ── */
    #done-wrap {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 12px 14px;
      background: linear-gradient(transparent, #0d1117 38%);
      pointer-events: none;
    }
    #btn-done {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity .15s; pointer-events: all;
    }
    #btn-done:active { opacity: .8; }
  </style>
</head>
<body>

<div id="header">
  <input id="search" type="text" placeholder="🔍 Поиск страны…" autocomplete="off" oninput="filter(this.value)">
</div>
<div id="counter-bar">
  <span id="counter-label">Посещено</span>
  <span id="counter-badge">0 из 0</span>
</div>
<div id="list"></div>
<div id="done-wrap">
  <p id="save-status" role="status"></p>
  <button id="restore-local" onclick="restoreLocal()" hidden>Добавить старые отметки с устройства</button>
  <button id="btn-done" onclick="closeApp()" disabled>Сохранить</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
if (tg.setHeaderColor)    tg.setHeaderColor('#161b22');
if (tg.setBackgroundColor) tg.setBackgroundColor('#0d1117');

/* ── 195 стран ООН + 6 особых территорий = 201 ── */
let ALL = [];
const status = document.getElementById('save-status');
const saveButton = document.getElementById('btn-done');
const restoreButton = document.getElementById('restore-local');
let revision = null;
let visited = new Set();
let legacy = [];
let query = '';

async function initialize() {
  try {
    const response = await fetch('countries.json');
    if (!response.ok) throw new Error('Countries unavailable');
    ALL = await response.json();
    const payload = new URLSearchParams(location.hash.slice(1)).get('countries');
    if (payload) {
      const bytes = Uint8Array.from(atob(payload.replace(/-/g, '+').replace(/_/g, '/')),
        char => char.charCodeAt(0));
      const snapshot = JSON.parse(new TextDecoder().decode(bytes));
      if (Number.isSafeInteger(snapshot.revision) && snapshot.revision >= 0 &&
          Array.isArray(snapshot.indices)) {
        revision = snapshot.revision;
        visited = new Set(snapshot.indices.map(index => ALL[index]?.[0]).filter(Boolean));
        saveButton.disabled = false;
      }
    }
  } catch (_) {
    // A damaged or old link cannot authorize replacement of the server snapshot.
  }
  if (revision === null) {
    status.textContent = 'Открой «Мои страны» заново из меню бота, чтобы загрузить список.';
  } else {
    try {
      const local = JSON.parse(localStorage.getItem('visited_v2') || '[]');
      if (Array.isArray(local)) {
        legacy = local.filter(name => ALL.some(([known]) => known === name) && !visited.has(name));
        restoreButton.hidden = legacy.length === 0;
      }
    } catch (_) {
      // The server snapshot remains usable if local storage is unavailable.
    }
  }
  render();
  updateCounter();
}

function restoreLocal() {
  for (const name of legacy) visited.add(name);
  restoreButton.hidden = true;
  render();
  updateCounter();
}

function render() {
  const q = query.toLowerCase();
  const items = q ? ALL.filter(([n]) => n.toLowerCase().includes(q)) : ALL;
  const el = document.getElementById('list');
  if (!items.length) { el.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
  el.innerHTML = items.map(([name, flag]) => {
    const on = visited.has(name);
    const safe = name.replace(/'/g, "\\'");
    return `<div class="row${on?' on':''}" onclick="toggle('${safe}')">
      <span class="flag">${flag}</span>
      <span class="name">${name}</span>
      <span class="box">
        <svg class="tick" width="12" height="9" viewBox="0 0 12 9" fill="none">
          <path d="M1 4l3.5 3.5L11 1" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>`;
  }).join('');
}

function updateCounter() {
  const n = visited.size;
  const badge = document.getElementById('counter-badge');
  badge.textContent = `${n} из ${ALL.length}`;
  badge.className = n ? 'has' : '';
}

function toggle(name) {
  if (revision === null) return;
  visited.has(name) ? visited.delete(name) : visited.add(name);
  render();
  updateCounter();
}

function filter(v) { query = v; render(); }

function closeApp() {
  if (revision === null) return;
  try {
    tg.sendData(JSON.stringify({
      source: "countries_v2",
      revision,
      indices: ALL.flatMap(([name], index) => visited.has(name) ? [index] : [])
    }));
    status.textContent = 'Подтверждение сохранения появится в чате.';
  } catch (_) {
    status.textContent = 'Не удалось отправить список. Попробуй ещё раз.';
  }
}

initialize();
</script>
</body>
</html>
