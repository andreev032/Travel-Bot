<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мои воды</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; overflow: hidden;
      background: #0d1117; color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    #header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 12px 8px;
      flex-shrink: 0;
    }
    #search {
      width: 100%; background: #21262d; border: 1px solid #30363d;
      border-radius: 8px; padding: 9px 12px; color: #c9d1d9;
      font-size: 14px; outline: none;
    }
    #search::placeholder { color: #484f58; }
    #search:focus { border-color: #58a6ff; }

    /* ── Counter bar ── */
    #counter-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 12px; background: #0d1117;
      border-bottom: 1px solid #21262d; flex-shrink: 0; gap: 8px;
    }
    #counter-label { font-size: 13px; color: #8b949e; white-space: nowrap; }
    #counter-badge {
      background: #21262d; color: #484f58;
      font-size: 12px; font-weight: 700;
      padding: 3px 11px; border-radius: 20px;
      min-width: 64px; text-align: center;
      transition: background .2s, color .2s;
    }
    #counter-badge.has { background: #238636; color: #fff; }
    #status-msg {
      font-size: 11px; color: #484f58; margin-left: auto;
      white-space: nowrap;
    }
    #status-msg.err { color: #f85149; }

    /* ── List ── */
    #list {
      overflow-y: auto; flex: 1; padding: 4px 10px 90px;
      -webkit-overflow-scrolling: touch;
    }

    .cat-header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 4px 6px; font-size: 13px; font-weight: 700;
      color: #8b949e; letter-spacing: .02em; user-select: none;
    }
    .cat-header:first-child { padding-top: 8px; }
    .cat-count {
      background: #21262d; color: #484f58;
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
      transition: background .2s, color .2s;
    }
    .cat-count.has { background: #238636; color: #fff; }

    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 8px; border-radius: 8px;
      cursor: pointer; transition: background .12s;
      user-select: none;
    }
    .row:active { background: #1c2128; }
    .row.on { background: #0f2617; }
    .row.pending { opacity: 0.55; }
    .flag { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.on .name { color: #3fb950; }
    .country { font-size: 11px; color: #484f58; margin-top: 1px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.on .country { color: #2ea043; }
    .box {
      width: 21px; height: 21px; border: 2px solid #30363d;
      border-radius: 5px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, border-color .12s;
    }
    .row.on .box { background: #238636; border-color: #238636; }
    .tick { display: none; }
    .row.on .tick { display: block; }
    .empty { text-align: center; color: #484f58; font-size: 14px; padding: 36px 0; }

    /* ── Bottom button ── */
    #done-wrap {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 12px 14px;
      background: linear-gradient(transparent, #0d1117 38%);
      pointer-events: none;
    }
    #btn-done {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity .15s; pointer-events: all;
    }
    #btn-done:active { opacity: .8; }
  </style>
</head>
<body>

<div id="header">
  <input id="search" type="text" placeholder="🔍 Поиск..."
         autocomplete="off" oninput="filter(this.value)">
</div>
<div id="counter-bar">
  <span id="counter-label">Посещено</span>
  <span id="counter-badge">0 из 0</span>
  <span id="status-msg"></span>
</div>
<div id="list"></div>
<div id="done-wrap">
  <button id="btn-done" onclick="closeApp()">Закрыть</button>

const tg = window.Telegram.WebApp;

if (tg.setHeaderColor)     tg.setHeaderColor('#161b22');
if (tg.setBackgroundColor) tg.setBackgroundColor('#0d1117');

// initData читается СВЕЖЕ при каждом запросе (на случай поздней инициализации SDK)
// и отправляется тремя способами параллельно: некоторые клиенты Telegram (Desktop,
// старые Android) могут стрипать custom-заголовки при cross-origin fetch — поэтому
// дублируем через query/body. Сервер принимает любой из трёх источников.
function getInitData() {
  return (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || "";
}
function authHeaders() {
  const data = getInitData();
  return {
    "Authorization": "tma " + data,
    "X-Telegram-Init-Data": data,
  };
}

  { id: 'ontario',    name: 'Онтарио',     type: 'lake', ocean: 'arctic',   countries: 'США, Канада' },
  { id: 'baikal',     name: 'Байкал',      type: 'lake', ocean: 'arctic',   countries: 'Россия' },
  { id: 'balkhash',   name: 'Балхаш',      type: 'lake', ocean: 'arctic',   countries: 'Казахстан' },
  { id: 'issyk_kul',  name: 'Иссык-Куль',  type: 'lake', ocean: 'arctic',   countries: 'Кыргызстан' },
  { id: 'ladoga',     name: 'Ладожское',   type: 'lake', ocean: 'arctic',   countries: 'Россия' },

  // ── Внутренние воды (6) ─────────────────────────────────────
  { id: 'caspian',  name: 'Каспийское море', type: 'internal', countries: 'Россия, Казахстан, Туркменистан, Иран, Азербайджан' },
  { id: 'dead_sea', name: 'Мёртвое море',    type: 'internal', countries: 'Израиль, Иордания, Палестина' },
  { id: 'aral',     name: 'Аральское море',  type: 'internal', countries: 'Казахстан, Узбекистан' },
  { id: 'volga',    name: 'Волга',           type: 'internal', countries: 'Россия' },
  { id: 'jordan',   name: 'Иордан',          type: 'internal', countries: 'Израиль, Иордания, Сирия, Палестина' },
  { id: 'ili',      name: 'Или',             type: 'internal', countries: 'Китай, Казахстан' },
];

const CATEGORIES = [
  { id: 'ocean',    title: '🌍 Океаны',          icon: '🌍' },
  { id: 'sea',      title: '🌊 Моря',            icon: '🌊' },
  { id: 'river',    title: '🏞 Реки',            icon: '🏞' },
  { id: 'lake',     title: '🏔 Озёра',           icon: '🏔' },
  { id: 'internal', title: '⚠️ Внутренние воды', icon: '⚠️' },
];

/* ═══════════════════════════════════════════
   СОСТОЯНИЕ
═══════════════════════════════════════════ */
let visited = new Set();
let filterQuery = "";

const listEl   = document.getElementById("list");
const badgeEl  = document.getElementById("counter-badge");
const statusEl = document.getElementById("status-msg");

function setStatus(text, isErr) {
  statusEl.textContent = text || "";
  statusEl.classList.toggle("err", !!isErr);
}

/* ═══════════════════════════════════════════
   API — только visited
═══════════════════════════════════════════ */
async function loadVisited() {
  const initData = getInitData();
  if (!initData) {
    setStatus("Откройте через бота", true);
    return;
  }
  try {
    const url = `${API_BASE}/api/waters?initData=${encodeURIComponent(initData)}`;
    const res = await fetch(url, {
      method: "GET",
      headers: authHeaders(),
    });
    if (!res.ok) {
      setStatus(res.status === 401 ? "Откройте через бота" : `Ошибка ${res.status}`, true);
      return;
    }
    const data = await res.json();
    visited = new Set(data.visited || []);
    setStatus("");
    render();
  } catch (e) {
    setStatus("Нет связи", true);
  }
}

async function toggle(id, rowEl) {
  const wasOn = visited.has(id);
  if (wasOn) visited.delete(id);
  else       visited.add(id);
  rowEl.classList.toggle("on", visited.has(id));
  rowEl.classList.add("pending");
  updateCounter();

  try {
    const initData = getInitData();
    if (!initData) {
      throw new Error("no initData");
    }
    const res = await fetch(`${API_BASE}/api/waters`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...authHeaders(),
      },
      // initData в body — дублирующий канал на случай, если custom-заголовки
      // будут стрипнуты прокси/клиентом Telegram.
      body: JSON.stringify({ id, action: "toggle", initData }),
    });
    if (!res.ok) throw new Error("status " + res.status);
    const data = await res.json();
    if (typeof data.visited === "boolean") {
      if (data.visited) visited.add(id);
      else              visited.delete(id);
      rowEl.classList.toggle("on", data.visited);
    }
    setStatus("");
  } catch (e) {
    if (wasOn) visited.add(id);
    else       visited.delete(id);
    rowEl.classList.toggle("on", visited.has(id));
    setStatus("Ошибка сохранения", true);
  } finally {
    rowEl.classList.remove("pending");
    updateCounter();
  }
}

/* ═══════════════════════════════════════════
   РЕНДЕР
═══════════════════════════════════════════ */
function render() {
  const q = filterQuery.trim().toLowerCase();
  listEl.innerHTML = "";

  let totalVisible = 0;

  CATEGORIES.forEach(cat => {
    const items = WATERS_LIST.filter(w => w.type === cat.id);
    if (items.length === 0) return;

    const visibleItems = items.filter(w => {
      if (!q) return true;
      if (w.name.toLowerCase().includes(q)) return true;
      return (w.countries || "").toLowerCase().includes(q);
    });
    if (visibleItems.length === 0) return;

    const catVisited = items.filter(w => visited.has(w.id)).length;

    const hdr = document.createElement("div");
    hdr.className = "cat-header";
    hdr.innerHTML = `<span>${cat.title}</span>
      <span class="cat-count${catVisited > 0 ? " has" : ""}" data-cat="${cat.id}">
        ${catVisited}/${items.length}
      </span>`;
    listEl.appendChild(hdr);

    visibleItems.forEach(w => {
      const isOn = visited.has(w.id);
      const row = document.createElement("div");
      row.className = "row" + (isOn ? " on" : "");
      row.innerHTML = `
        <span class="flag">${cat.icon}</span>
        <div class="info">
          <div class="name"></div>
          <div class="country"></div>
        </div>
        <div class="box">
          <svg class="tick" width="13" height="10" viewBox="0 0 13 10" fill="none">
            <path d="M1.5 5L5 8.5L11.5 1.5" stroke="#fff" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>`;
      row.querySelector(".name").textContent    = w.name;
      row.querySelector(".country").textContent = w.countries || "";
      row.addEventListener("click", () => {
        if (!row.classList.contains("pending")) toggle(w.id, row);
      });
      listEl.appendChild(row);
      totalVisible++;
    });
  });

  if (totalVisible === 0) {
    listEl.innerHTML = '<div class="empty">Ничего не найдено</div>';
  }
  updateCounter();
}

function updateCounter() {
  const total = WATERS_LIST.length;
  badgeEl.textContent = visited.size + " из " + total;
  badgeEl.classList.toggle("has", visited.size > 0);

  CATEGORIES.forEach(cat => {
    const items = WATERS_LIST.filter(w => w.type === cat.id);
    const el = listEl.querySelector(`.cat-count[data-cat="${cat.id}"]`);
    if (!el) return;
    const cnt = items.filter(w => visited.has(w.id)).length;
    el.textContent = cnt + "/" + items.length;
    el.classList.toggle("has", cnt > 0);
  });
}

function filter(val) {
  filterQuery = val;
  render();
}

function closeApp() { tg.close(); }

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
render();         // мгновенный показ списка
loadVisited();    // подгрузка отметок поверх
</script>
